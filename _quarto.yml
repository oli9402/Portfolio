  back-to-top-navigation: true
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "© 2026 Oliver Zingg · Built with [Quarto](https://quarto.org)"
    right:
      - href: mailto:oliver9402@gmail.com
        icon: envelope
        aria-label: Email
      - href: https://github.com/oli9402
        icon: github
        aria-label: GitHub
      - href: https://www.linkedin.com/in/oliver-zingg-321b0228a/
        icon: linkedin
        aria-label: LinkedIn
      - href: https://twitter.com/oliver_zingg
        icon: twitter-x
        aria-label: Twitter / X
  navbar:
    title: 'Oliver Zingg'
    collapse-below: lg
    pinned: true
    right:
