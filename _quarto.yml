format:
  html:
    toc: true
    code-link: true
    code-fold: true
    grid:
      sidebar-width: 240px
      body-width: 860px
      margin-width: 240px
    highlight-style:
      light: a11y
      dark: a11y-dark
    theme:
      light: [cosmo, theme.scss, theme-light.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    respect-user-color-scheme: true
    smooth-scroll: true
    anchor-sections: true


execute:
  freeze: auto
